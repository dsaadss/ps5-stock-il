name: check stock
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python check.py --test && python check.py
      - run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "update stock" || exit 0
          git pull --rebase && git push
